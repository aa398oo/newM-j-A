name: Android Debug APK

# 本机没有 Android SDK，构建全部走云端（决策台账 D58）。
# 仓库根目录按 android/ 计算；若把 android/ 作为独立仓库推送，路径无需调整。
#
# 手动触发时可以传 runtime_url：CI 会把该压缩包解到 app/src/main/assets/runtime/，
# 从而产出「带 JRE、能验证第 1/2 步」的 APK。压缩包根目录必须直接包含
# lib/server/libjvm.so 与 lib/modules（zip 或 tar.xz 都行）。

on:
  push:
  workflow_dispatch:
    inputs:
      runtime_url:
        description: "可选：JRE 运行时压缩包 URL（zip/tar.xz），根目录含 lib/server/libjvm.so"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Inject runtime (optional)
        if: ${{ inputs.runtime_url != '' }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/runtime
          curl -L --fail --retry 3 -o /tmp/runtime.pack "${{ inputs.runtime_url }}"
          case "${{ inputs.runtime_url }}" in
            *.zip) unzip -q /tmp/runtime.pack -d app/src/main/assets/runtime ;;
            *) tar -xJf /tmp/runtime.pack -C app/src/main/assets/runtime ;;
          esac
          ls app/src/main/assets/runtime

      - name: Prepare runtime from FCL (JRE17 + LWJGL + GL4ES)
        if: ${{ inputs.runtime_url == '' }}
        run: |
          set -euo pipefail
          # 二进制不进仓库（D25），云构建时从上游 FCL 的 arm64 APK 里取：
          #   JRE17（assets/app_runtime/java/jre17）+ LWJGL 3.4.1 + GL4ES/OpenAL
          URL="https://github.com/FCL-Team/FoldCraftLauncher/releases/download/1.3.4.7/FCL-release-1.3.4.7-arm64-v8a.apk"
          curl -L --fail --retry 3 -o /tmp/fcl.apk "$URL"
          mkdir -p /tmp/fcl
          unzip -q -o /tmp/fcl.apk 'assets/app_runtime/java/jre17/*' 'assets/app_runtime/lwjgl/3.4.1/*' 'lib/arm64-v8a/*' -d /tmp/fcl
          mkdir -p app/src/main/assets/runtime app/src/main/jniLibs/arm64-v8a app/src/main/assets/runtime/lwjgl
          tar -xJf /tmp/fcl/assets/app_runtime/java/jre17/universal.tar.xz -C app/src/main/assets/runtime
          tar -xJf /tmp/fcl/assets/app_runtime/java/jre17/bin-arm64.tar.xz -C app/src/main/assets/runtime
          cp /tmp/fcl/assets/app_runtime/lwjgl/3.4.1/*.jar app/src/main/assets/runtime/lwjgl/
          cp /tmp/fcl/assets/app_runtime/lwjgl/3.4.1/natives/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          for lib in libng_gl4es.so libgl4es_114.so libopenal.so libc++_shared.so; do
            cp "/tmp/fcl/lib/arm64-v8a/$lib" app/src/main/jniLibs/arm64-v8a/
          done
          rm -f app/src/main/jniLibs/arm64-v8a/libEGL*.so app/src/main/jniLibs/arm64-v8a/libGLESv2*.so
          node scripts/check-runtime.mjs

      - name: Build FCLCore jar (best effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          # FCL 仓库很大（含历史与资源），sparse 只取 FCLCore 与根构建配置。
          # 这一步允许失败：失败时 APK 仍然可编，只是 JVM 里没有 FCLCore，启动会停在版本显示。
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FCL-Team/FoldCraftLauncher.git /tmp/fcl
          cd /tmp/fcl
          git sparse-checkout set FCLCore gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties
          chmod +x gradlew || true
          ./gradlew :FCLCore:jar --no-daemon || true
          JAR=$(find . -path '*/build/libs/*' -name 'FCLCore*.jar' | head -1 || true)
          echo "FCLCore jar: ${JAR:-<none>}"
          if [ -n "${JAR:-}" ]; then
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/runtime"
            cp "$JAR" "$GITHUB_WORKSPACE/app/src/main/assets/runtime/FCLCore.jar"
          fi

      - name: Static source check
        run: node scripts/check-sources.mjs .

      - name: JNI symbol check
        run: node scripts/check-jni.mjs .

      - name: Runtime binary check
        run: |
          if [ -n "${{ inputs.runtime_url }}" ]; then
            node scripts/check-runtime.mjs
          else
            node scripts/check-runtime.mjs --warn-only
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure debug keystore
        run: |
          # app/build.gradle.kts 用工程内 .keystore/debug.keystore 签名（本机
          # ~/.android 对 Gradle 不可写）。仓库里没提交该文件时在 CI 生成，
          # 保证 CI 与本机产物可以互相覆盖安装（debug key 无保密价值）。
          if [ ! -f .keystore/debug.keystore ]; then
            mkdir -p .keystore
            keytool -genkeypair -v -keystore .keystore/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l .keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
